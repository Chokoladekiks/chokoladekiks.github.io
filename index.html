<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height, target-densitydpi=device-dpi" />
    <title>Tangled Edition - Dark Mode</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #e0e0e0;
        }
        h1 {
            margin-top: 20px;
            font-size: 36px;
            color: #ffffff;
        }
        .total-count {
            font-size: 24px;
            margin: 10px 0;
        }
        .counters {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            margin-top: 50px;
        }
        .counter {
            text-align: center;
        }
        .counter div {
            font-size: 48px;
            margin: 20px 20px;
            color: #ffffff;
        }
        .ratio {
            font-size: 32px;
            color: #bbbbbb;
        }
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            margin-top: 20px;
        }
        .control-group {
            text-align: center;
        }
        button {
            touch-action: manipulation;
        }
        .control-group button {
            display: block;
            width: min(120px, 28vw);
            height: 50px;
            margin: 10px;
            font-size: 18px;
            color: #ffffff;
            background-color: #333333;
            border: 2px solid #444444;
            border-radius: 5px;
            cursor: pointer;
        }
        .control-group button:hover {
            background-color: #555555;
        }
        .reset-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 100px;
            height: 40px;
            font-size: 14px;
            color: #ffffff;
            background-color: #7a1a1a;
            border: 2px solid #a33;
            border-radius: 5px;
            cursor: pointer;
        }
        .reset-btn:hover {
            background-color: #a02020;
        }
    </style>
</head>
<body>

<h1>Tangled</h1>

<div class="total-count" id="totalCount">
    Total: 0 mænd, 0 kvinder, 0 personer i alt
</div>

<div class="counters">
    <div class="counter">
        <div id="maleCount">0</div>
        <p>Mænd</p>
    </div>

    <div class="ratio" id="ratio">
        Ratio: 0.0
    </div>

    <div class="counter">
        <div id="femaleCount">0</div>
        <p>Kvinder</p>
    </div>
</div>

<div class="controls">
    <div class="control-group">
        <button onclick="increment('male')">+ Mand</button>
        <button onclick="decrement('male')">- Mand</button>
    </div>

    <div class="control-group">
        <button onclick="incrementPair()">+ Par</button>
        <button onclick="decrementPair()">- Par</button>
    </div>

    <div class="control-group">
        <button onclick="increment('female')">+ Kvinde</button>
        <button onclick="decrement('female')">- Kvinde</button>
    </div>
</div>

<button class="reset-btn" onclick="resetAll()">Nulstil</button>

<script>
    const counts = { male: readCookie('male'), female: readCookie('female') };

    function readCookie(name) {
        const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=(\\d+)'));
        return match ? Number(match[1]) : 0;
    }

    function save() {
        for (const key in counts) {
            document.cookie = `${key}=${counts[key]}; path=/; max-age=31536000; SameSite=Lax`;
        }
    }

    function render() {
        const { male, female } = counts;
        document.getElementById('maleCount').textContent = male;
        document.getElementById('femaleCount').textContent = female;
        document.getElementById('totalCount').textContent =
            `Total: ${male} mænd, ${female} kvinder, ${male + female} personer i alt`;
        const ratio = female === 0 ? (male === 0 ? '0.0' : '∞') : (male / female).toFixed(1);
        document.getElementById('ratio').textContent = 'Ratio: ' + ratio;
    }

    function update() {
        render();
        save();
    }

    function increment(gender) {
        counts[gender]++;
        update();
    }

    function decrement(gender) {
        if (counts[gender] > 0) {
            counts[gender]--;
            update();
        }
    }

    function incrementPair() {
        counts.male++;
        counts.female++;
        update();
    }

    function decrementPair() {
        if (counts.male > 0 && counts.female > 0) {
            counts.male--;
            counts.female--;
            update();
        }
    }

    function resetAll() {
        if (!confirm('Nulstil tællerne?')) return;
        counts.male = 0;
        counts.female = 0;
        update();
    }

    render();
</script>

</body>
</html>
