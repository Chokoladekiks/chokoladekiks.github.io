<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height, target-densitydpi=device-dpi" />
    <title>Tangled Edition - Dark Mode</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #e0e0e0;
        }
        h1 {
            margin-top: 20px;
            font-size: 36px;
            color: #ffffff;
        }
        .total-count {
            font-size: 24px;
            margin: 10px 0;
        }
        .counters {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            margin-top: 50px;
        }
        .counter {
            text-align: center;
        }
        .counter div {
            font-size: 48px;
            margin: 20px 20px;
            color: #ffffff;
        }
        .ratio {
            font-size: 32px;
            color: #bbbbbb;
        }
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            margin-top: 20px;
        }
        .control-group {
            text-align: center;
        }
        .control-group button {
            display: block;
            width: 120px;
            height: 50px;
            margin: 10px;
            font-size: 18px;
            color: #ffffff;
            background-color: #333333;
            border: 2px solid #444444;
            border-radius: 5px;
            cursor: pointer;
        }
        .control-group button:hover {
            background-color: #555555;
        }
        .reset-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 100px;
            height: 40px;
            font-size: 14px;
            color: #ffffff;
            background-color: #7a1a1a;
            border: 2px solid #a33;
            border-radius: 5px;
            cursor: pointer;
        }
        .reset-btn:hover {
            background-color: #a02020;
        }
    </style>
</head>
<body>

<h1>Tangled</h1>

<div class="total-count" id="totalCount">
    Total: 0 mænd, 0 kvinder, 0 personer i alt
</div>

<div class="counters">
    <div class="counter">
        <div id="maleCount">0</div>
        <p>Mænd</p>
    </div>

    <div class="ratio" id="ratio">
        Ratio: 0.0
    </div>

    <div class="counter">
        <div id="femaleCount">0</div>
        <p>Kvinder</p>
    </div>
</div>

<div class="controls">
    <div class="control-group">
        <button onclick="increment('male')">+ Mand</button>
        <button onclick="decrement('male')">- Mand</button>
    </div>

    <div class="control-group">
        <button onclick="incrementPair()">+ Par</button>
        <button onclick="decrementPair()">- Par</button>
    </div>

    <div class="control-group">
        <button onclick="increment('female')">+ Kvinde</button>
        <button onclick="decrement('female')">- Kvinde</button>
    </div>
</div>

<button class="reset-btn" onclick="resetAll()">Nulstil</button>

<script>
    let totalMales = 0;
    let totalFemales = 0;

    function setCookie(name, value) {
        document.cookie = name + '=' + value + '; path=/; max-age=31536000';
    }

    function getCookie(name) {
        const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
        return match ? parseInt(match[1], 10) : 0;
    }

    function saveState() {
        setCookie('totalMales', totalMales);
        setCookie('totalFemales', totalFemales);
    }

    function loadState() {
        totalMales = getCookie('totalMales');
        totalFemales = getCookie('totalFemales');
        document.getElementById('maleCount').textContent = totalMales;
        document.getElementById('femaleCount').textContent = totalFemales;
        updateTotal();
        updateRatio();
    }

    function increment(gender) {
        if (gender === 'male') {
            totalMales++;
        } else {
            totalFemales++;
        }
        document.getElementById(gender + 'Count').textContent = gender === 'male' ? totalMales : totalFemales;
        updateTotal();
        updateRatio();
        saveState();
    }

    function decrement(gender) {
        if (gender === 'male' && totalMales > 0) {
            totalMales--;
        } else if (gender === 'female' && totalFemales > 0) {
            totalFemales--;
        }
        document.getElementById(gender + 'Count').textContent = gender === 'male' ? totalMales : totalFemales;
        updateTotal();
        updateRatio();
        saveState();
    }

    function incrementPair() {
        increment('male');
        increment('female');
    }

    function decrementPair() {
        if (totalMales > 0 && totalFemales > 0) {
            decrement('male');
            decrement('female');
        }
    }

    function resetAll() {
        totalMales = 0;
        totalFemales = 0;
        document.getElementById('maleCount').textContent = 0;
        document.getElementById('femaleCount').textContent = 0;
        updateTotal();
        updateRatio();
        saveState();
    }

    function updateRatio() {
        const ratioElement = document.getElementById('ratio');
        if (totalFemales === 0) {
            ratioElement.textContent = 'Ratio: ' + (totalMales === 0 ? '0.0' : '∞');
        } else {
            ratioElement.textContent = 'Ratio: ' + (totalMales / totalFemales).toFixed(1);
        }
    }

    function updateTotal() {
        const totalCountElement = document.getElementById('totalCount');
        const totalPersons = totalMales + totalFemales;
        totalCountElement.textContent = `Total: ${totalMales} mænd, ${totalFemales} kvinder, ${totalPersons} personer i alt`;
    }

    loadState();
</script>

</body>
</html>
