<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height, target-densitydpi=device-dpi" />
    <title>Tangled Edition - Dark Mode</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #e0e0e0;
        }
        h1 {
            margin-top: 20px;
            margin-bottom: 4px;
            font-size: 36px;
            color: #ffffff;
        }
        .total-count {
            font-size: 24px;
            margin: 10px 0;
        }
        .counters {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            margin-top: 50px;
        }
        .counter {
            text-align: center;
        }
        .counter div {
            font-size: 48px;
            margin: 20px 20px;
            color: #ffffff;
        }
        .ratio {
            font-size: 32px;
            color: #bbbbbb;
        }
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            margin-top: 20px;
        }
        .control-group {
            text-align: center;
        }
        button {
            touch-action: manipulation;
        }
        .control-group button {
            display: block;
            width: min(120px, 28vw);
            height: 50px;
            margin: 10px;
            font-size: 18px;
            color: #ffffff;
            background-color: #333333;
            border: 2px solid #444444;
            border-radius: 5px;
            cursor: pointer;
        }
        .control-group button:hover {
            background-color: #555555;
        }
        .reset-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 100px;
            height: 40px;
            font-size: 14px;
            color: #ffffff;
            background-color: #7a1a1a;
            border: 2px solid #a33;
            border-radius: 5px;
            cursor: pointer;
        }
        @media (min-width: 768px) and (orientation: landscape) {
            .counters { margin-top: 3vh; }
            .counter div { font-size: 96px; margin: 10px 20px; }
            .ratio { font-size: 48px; }
            .controls { margin-top: 3vh; }
            .control-group button {
                width: 220px;
                height: 90px;
                margin: 14px;
                font-size: 28px;
            }
        }
        .round-label {
            font-size: 16px;
            color: #bbbbbb;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .all-count {
            font-size: 16px;
            color: #bbbbbb;
        }
        .round-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 14px;
            font-size: 14px;
            color: #ffffff;
            background-color: #333333;
            border: 2px solid #444444;
            border-radius: 5px;
            cursor: pointer;
        }
        .stats-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 10px 14px;
            font-size: 14px;
            color: #ffffff;
            background-color: #333333;
            border: 2px solid #444444;
            border-radius: 5px;
            text-decoration: none;
        }
        .reset-btn:hover {
            background-color: #a02020;
        }
        .start-btn {
            margin-top: 16px;
            padding: 10px 14px;
            font-size: 14px;
            color: #ffffff;
            background-color: #333333;
            border: 2px solid #444444;
            border-radius: 5px;
            cursor: pointer;
        }
        dialog {
            background: #1e1e1e;
            color: #e0e0e0;
            border: 2px solid #444444;
            border-radius: 8px;
            padding: 20px;
            max-width: 90vw;
        }
        dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
        dialog h2 { margin: 0 0 8px; font-size: 20px; }
        dialog p { margin: 0 0 14px; color: #bbbbbb; font-size: 14px; max-width: 320px; }
        dialog { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .field {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 8px 12px;
            background: #121212;
            color: #bbbbbb;
            border: 2px solid #444444;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }
        .field[aria-pressed="true"] { border-color: #ffffff; color: #ffffff; }
        .field .val { font-size: 34px; color: #ffffff; font-variant-numeric: tabular-nums; min-height: 40px; }
        .field .val:empty::before { content: '0'; color: #555555; }
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .numpad button {
            height: min(64px, 9vh);
            font-size: 28px;
            color: #ffffff;
            background-color: #333333;
            border: 2px solid #444444;
            border-radius: 6px;
            cursor: pointer;
        }
        .numpad button:active, .dialog-buttons button:active { background-color: #555555; }
        dialog button { -webkit-tap-highlight-color: transparent; }
        dialog button:focus:not(:focus-visible) { outline: none; }
        .numpad .small { font-size: 18px; }
        dialog .dialog-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        dialog .dialog-buttons button {
            padding: 14px 16px;
            font-size: 18px;
            color: #ffffff;
            background-color: #333333;
            border: 2px solid #444444;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Tangled</h1>

<div class="round-label" id="roundLabel">Runde 1</div>

<div class="total-count" id="totalCount">
    Total: 0 mænd, 0 kvinder, 0 personer i alt
</div>
<div class="all-count" id="allCount" hidden></div>

<div class="counters">
    <div class="counter">
        <div id="maleCount">0</div>
        <p>Mænd</p>
    </div>

    <div class="ratio" id="ratio">
        Ratio: 0.0
    </div>

    <div class="counter">
        <div id="femaleCount">0</div>
        <p>Kvinder</p>
    </div>
</div>

<div class="controls">
    <div class="control-group">
        <button onclick="increment('male')">+ Mand</button>
        <button onclick="decrement('male')">- Mand</button>
    </div>

    <div class="control-group">
        <button onclick="incrementPair()">+ Par</button>
        <button onclick="decrementPair()">- Par</button>
    </div>

    <div class="control-group">
        <button onclick="increment('female')">+ Kvinde</button>
        <button onclick="decrement('female')">- Kvinde</button>
    </div>
</div>

<button class="start-btn" onclick="openStart()">Startantal</button>

<dialog id="startDialog">
    <form method="dialog" onsubmit="saveStart()">
        <h2>Startantal</h2>
        <p>Hvor mange er her allerede, når I begynder at tælle? De tæller med i totalen og ratioen, men ikke som kommet i statistikken.</p>
        <div class="fields">
            <button type="button" class="field" data-field="male" aria-pressed="true">Mænd<span class="val" id="startMale"></span></button>
            <button type="button" class="field" data-field="female" aria-pressed="false">Kvinder<span class="val" id="startFemale"></span></button>
        </div>
        <div class="numpad" id="numpad">
            <button type="button">1</button><button type="button">2</button><button type="button">3</button>
            <button type="button">4</button><button type="button">5</button><button type="button">6</button>
            <button type="button">7</button><button type="button">8</button><button type="button">9</button>
            <button type="button" class="small" data-key="clear">Ryd</button><button type="button">0</button><button type="button" data-key="back" aria-label="Slet">⌫</button>
        </div>
        <div class="dialog-buttons">
            <button type="button" onclick="document.getElementById('startDialog').close()">Annuller</button>
            <button type="submit">Gem</button>
        </div>
    </form>
</dialog>

<button class="round-btn" onclick="newRound()">Ny runde</button>
<a class="stats-link" href="stats.html">Statistik</a>
<button class="reset-btn" onclick="resetAll()">Nulstil</button>

<script src="rounds.js"></script>
<script>
    function currentRound() {
        const rounds = getRounds();
        return rounds.length ? rounds[rounds.length - 1] : [];
    }

    // The round a new entry will land in: empty if the pause gap has passed.
    function activeRound() {
        const round = currentRound();
        const last = round[round.length - 1];
        return last && Date.now() / 1000 - last[0] >= ROUND_GAP ? [] : round;
    }

    function people(s) {
        return `${s.totalMale} mænd, ${s.totalFemale} kvinder, ${s.totalMale + s.totalFemale} personer i alt`;
    }

    function render() {
        const rounds = getRounds();
        const s = summarize(rounds.length ? rounds[rounds.length - 1] : []);
        document.getElementById('roundLabel').textContent = 'Runde ' + Math.max(1, rounds.length);
        document.getElementById('maleCount').textContent = s.male;
        document.getElementById('femaleCount').textContent = s.female;
        document.getElementById('totalCount').textContent = 'Total: ' + people(s);
        const all = document.getElementById('allCount');
        all.hidden = rounds.length < 2;
        all.textContent = 'Alle runder: ' + people(summarize(rounds.flat()));
        const ratio = s.female === 0 ? (s.male === 0 ? '0.0' : '∞') : (s.male / s.female).toFixed(1);
        document.getElementById('ratio').textContent = 'Ratio: ' + ratio;
    }

    function log(...entries) {
        const now = Math.floor(Date.now() / 1000);
        writeStore('log', readLog().concat(entries.map(([g, d, kind]) => kind ? [now, g, d, kind] : [now, g, d])));
        render();
    }

    // Start counts are typed on an on-screen numpad, so the tablet's own keyboard never opens.
    // Tap Mænd or Kvinder to choose the field; a physical keyboard works too.
    let startField = 'male';

    function startEl(field) {
        return document.getElementById(field === 'male' ? 'startMale' : 'startFemale');
    }

    function chooseField(field) {
        startField = field;
        document.querySelectorAll('.field').forEach(f => f.setAttribute('aria-pressed', f.dataset.field === field));
    }

    function pressKey(key) {
        const v = startEl(startField);
        if (key === 'clear') v.textContent = '';
        else if (key === 'back') v.textContent = v.textContent.slice(0, -1);
        else if (/^\d$/.test(key) && v.textContent.length < 4) v.textContent = (v.textContent + key).replace(/^0+(?=\d)/, '');
    }

    document.querySelectorAll('.field').forEach(f => f.addEventListener('click', () => chooseField(f.dataset.field)));
    document.querySelectorAll('#numpad button').forEach(b => b.addEventListener('click', () => pressKey(b.dataset.key || b.textContent)));
    document.getElementById('startDialog').addEventListener('keydown', e => {
        if (/^\d$/.test(e.key)) pressKey(e.key);
        else if (e.key === 'Backspace') pressKey('back');
        else if (e.key === 'Tab') { e.preventDefault(); chooseField(startField === 'male' ? 'female' : 'male'); }
        else return;
        e.preventDefault();
    });

    function openStart() {
        startEl('male').textContent = '';
        startEl('female').textContent = '';
        chooseField('male');
        document.getElementById('startDialog').showModal();
    }

    function saveStart() {
        const male = parseInt(startEl('male').textContent, 10) || 0;
        const female = parseInt(startEl('female').textContent, 10) || 0;
        if (male + female === 0) return;
        if (activeRound().some(e => !isStart(e)) &&
            !confirm('Runden er allerede i gang. Lægge startantallet til nu alligevel? Tryk Ny runde først, hvis det er en ny runde.')) return;
        const entries = [];
        if (male) entries.push(['male', male, 'start']);
        if (female) entries.push(['female', female, 'start']);
        log(...entries);
    }

    function increment(gender) {
        log([gender, 1]);
    }

    function decrement(gender) {
        if (summarize(activeRound())[gender] > 0) log([gender, -1]);
    }

    function incrementPair() {
        log(['male', 1], ['female', 1]);
    }

    function decrementPair() {
        const s = summarize(activeRound());
        if (s.male > 0 && s.female > 0) log(['male', -1], ['female', -1]);
    }

    function newRound() {
        if (activeRound().length === 0) return;
        if (!confirm('Start en ny runde? Tællerne starter forfra, men totalen for alle runder bevares.')) return;
        writeStore('roundStarts', readStore('roundStarts').concat(readLog().length));
        render();
    }

    function resetAll() {
        if (!confirm('Nulstil alt? Alle runder og hele loggen slettes.')) return;
        try {
            localStorage.removeItem('log');
            localStorage.removeItem('roundStarts');
        } catch (e) {}
        render();
    }

    render();
</script>

</body>
</html>
