<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tangled Statistik</title>
    <style>
        :root {
            --surface: #121212;
            --surface-2: #1e1e1e;
            --text: #f0efec;
            --text-2: #c3c2b7;
            --muted: #8a897f;
            --grid: #2c2c2a;
            --male: #3987e5;
            --female: #d95926;
            color-scheme: dark;
        }
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background: var(--surface);
            color: var(--text);
            max-width: 900px;
            margin-inline: auto;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        h1 { font-size: 28px; margin: 8px 0; }
        h2 { font-size: 18px; margin: 0 0 4px; }
        .sub { color: var(--text-2); font-size: 14px; margin: 0 0 12px; }
        a, button {
            color: var(--text);
            background: #333;
            border: 2px solid #444;
            border-radius: 5px;
            padding: 8px 12px;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            touch-action: manipulation;
        }
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 20px; }
        .seg button[aria-pressed="true"] { background: #555; border-color: #777; }
        .card {
            background: var(--surface-2);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            position: relative;
        }
        .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
        .legend span { display: inline-flex; align-items: center; gap: 6px; }
        .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
        svg { display: block; width: 100%; overflow: visible; }
        /* Charts are read by tapping on a tablet: no text selection or long-press menu, and
           sideways drags move the marker while vertical drags still scroll the page. */
        svg[data-touch-chart] { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y; }
        .legend svg { display: inline-block; width: 12px; flex: none; }
        svg text { fill: var(--muted); font-size: 11px; }
        .tip {
            position: absolute;
            pointer-events: none;
            background: #000;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 15px;
            line-height: 1.45;
            white-space: nowrap;
            display: none;
            z-index: 2;
        }
        .empty { color: var(--text-2); padding: 24px 0; text-align: center; }
        details { color: var(--text-2); font-size: 14px; }
        table { border-collapse: collapse; width: 100%; margin-top: 8px; }
        th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
        th:first-child, td:first-child { text-align: left; }
        .source {
            background: #2a2416;
            border: 1px solid #5a4a20;
            border-radius: 8px;
            padding: 10px 12px;
            margin: -8px 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 14px;
        }
        .error { color: #ff8a80; }
        .zoom label { display: grid; grid-template-columns: 3.5em 1fr 3.5em; align-items: center; gap: 10px; margin: 8px 0; font-size: 14px; color: var(--text-2); }
        .zoom input[type=range] { width: 100%; accent-color: #888; }
        .zoom output { color: var(--text); font-variant-numeric: tabular-nums; }
        .zoom .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    </style>
</head>
<body>

<header>
    <h1>Statistik</h1>
    <a href="index.html">Tilbage til tæller</a>
</header>

<div class="toolbar">
    <div class="seg" id="roundSeg" role="group" aria-label="Runde"></div>
    <div class="seg" id="sizeSeg" role="group" aria-label="Interval">
        <button data-size="60" aria-pressed="false">1 min</button>
        <button data-size="300" aria-pressed="true">5 min</button>
    </div>
    <button id="csv">Hent CSV</button>
    <button id="importBtn">Importér CSV</button>
    <input type="file" id="importFile" accept=".csv,text/csv" hidden>
</div>
<div id="sourceBar"></div>

<div id="content"></div>

<script src="rounds.js"></script>
<script>
    const SVGNS = 'http://www.w3.org/2000/svg';
    let bucketSize = 300;
    let selectedRound = null;
    let imported = null;   // { name, rounds } from an imported CSV; shown instead of this device's log
    let zoom = null;       // [fromSec, toSec] of the shown period, or null for the whole round

    function sourceRounds() {
        return imported ? imported.rounds : getRounds().filter(r => r.length > 0);
    }

    function clock(sec) {
        return new Date(sec * 1000).toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' });
    }

    function buildBuckets(log, size) {
        const start = Math.floor(log[0][0] / size) * size;
        const n = Math.floor((log[log.length - 1][0] - start) / size) + 1;
        const buckets = Array.from({ length: n }, (_, i) => ({
            start: start + i * size,
            in: { male: 0, female: 0 },
            out: { male: 0, female: 0 },
        }));
        let cumMale = 0, cumFemale = 0, i = 0;
        for (const b of buckets) {
            while (i < log.length && log[i][0] < b.start + size) {
                const entry = log[i++];
                const [, g, d] = entry;
                // People already there at the start count as present, not as having come.
                if (!isStart(entry)) b[d > 0 ? 'in' : 'out'][g]++;
                if (g === 'male') cumMale += d; else cumFemale += d;
            }
            b.cumMale = cumMale;
            b.cumFemale = cumFemale;
            b.ratio = cumFemale > 0 ? cumMale / cumFemale : null;
        }
        return buckets;
    }

    function el(tag, attrs, parent) {
        const e = document.createElementNS(SVGNS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
    }

    function niceMax(v) {
        return Math.max(4, Math.ceil(v / 4) * 4);
    }

    // Tooltips stay open after a tap (a finger can't hover); a tap outside the charts or on
    // another chart closes them. With a mouse they follow the pointer as before.
    const hiders = [];
    function hideAllTips() {
        hiders.forEach(f => f());
    }
    document.addEventListener('pointerdown', e => {
        if (!e.target.closest('svg[data-touch-chart]')) hideAllTips();
    });

    function showTip(tip, card, html, x, y) {
        tip.innerHTML = html;
        tip.style.display = 'block';
        const w = tip.offsetWidth;
        const left = Math.min(Math.max(x - w / 2, 0), card.clientWidth - w);
        tip.style.left = left + 'px';
        tip.style.top = (y - tip.offsetHeight - 8) + 'px';
    }

    let cardTarget = null;  // where card() adds new cards; #content unless set

    function card(title, sub) {
        const c = document.createElement('section');
        c.className = 'card';
        c.innerHTML = `<h2>${title}</h2><p class="sub">${sub}</p>`;
        (cardTarget || document.getElementById('content')).appendChild(c);
        return c;
    }

    function xLabelEvery(n, width) {
        return Math.max(1, Math.ceil(n / Math.max(1, Math.floor(width / 48))));
    }

    function barPath(x, y0, y1, w) {
        const h = Math.abs(y1 - y0), r = Math.min(4, w / 2, h), dir = y1 < y0 ? -1 : 1;
        return `M${x},${y0}V${y1 - dir * r}q0,${dir * r} ${r},${dir * r}h${w - 2 * r}q${r},0 ${r},${-dir * r}V${y0}Z`;
    }

    function genderDiff(male, female, verb) {
        const diff = male - female;
        return diff === 0 ? `Lige mange ${verb}` : `${Math.abs(diff)} flere ${diff > 0 ? 'mænd' : 'kvinder'} ${verb}`;
    }

    function barChart(buckets) {
        const c = card('Kommet og gået pr. interval',
            'Over linjen: kommet. Under linjen: gået. Tallet over søjlerne viser, hvor mange flere mænd (M) eller kvinder (K) der kom.');
        c.insertAdjacentHTML('beforeend', `<div class="legend">
            <span><i class="sw" style="background:var(--male)"></i>Mænd</span>
            <span><i class="sw" style="background:var(--female)"></i>Kvinder</span>
            <span><svg width="12" height="12"><rect width="12" height="12" rx="3" fill="#888"/><rect width="12" height="12" rx="3" fill="url(#hatch)"/></svg>Flere af det ene køn</span>
            <span><i class="sw" style="background:#888;opacity:.45"></i>Gået (under linjen)</span>
        </div>`);
        const tip = document.createElement('div');
        tip.className = 'tip';
        c.appendChild(tip);

        const W = c.clientWidth - 32, H = 280;
        const m = { t: 20, r: 4, b: 24, l: 28 };
        const iw = W - m.l - m.r, ih = H - m.t - m.b;
        const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': 'Søjlediagram over mænd og kvinder der kom og gik', 'data-touch-chart': '' }, c);

        const maxIn = Math.max(0, ...buckets.map(b => Math.max(b.in.male, b.in.female)));
        const maxOut = Math.max(0, ...buckets.map(b => Math.max(b.out.male, b.out.female)));
        const step = niceMax(Math.max(1, maxIn, maxOut)) / 4;
        const top = Math.max(step, Math.ceil(maxIn / step) * step);
        const bottom = Math.ceil(maxOut / step) * step;
        const y = v => m.t + (top - v) / (top + bottom) * ih;
        for (let v = -bottom; v <= top; v += step) {
            el('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: 'var(--grid)' }, svg);
            el('text', { x: m.l - 6, y: y(v) + 4, 'text-anchor': 'end' }, svg).textContent = Math.abs(v);
        }

        const slot = iw / buckets.length;
        const barW = Math.max(2, Math.min(28, (slot - 6) / 2));
        const mark = el('rect', { y: m.t, width: slot, height: ih, fill: '#fff', 'fill-opacity': 0.07, rx: 4, visibility: 'hidden' }, svg);
        const hideBar = () => { tip.style.display = 'none'; mark.setAttribute('visibility', 'hidden'); };
        hiders.push(hideBar);
        const every = xLabelEvery(buckets.length, iw);
        buckets.forEach((b, i) => {
            const cx = m.l + slot * i + slot / 2;
            const lo = Math.min(b.in.male, b.in.female);
            [['male', cx - barW - 1], ['female', cx + 1]].forEach(([g, x]) => {
                const v = b.in[g];
                if (v > 0) {
                    el('path', { d: barPath(x, y(0), y(v), barW), fill: `var(--${g})` }, svg);
                    if (v > lo) {
                        el('path', { d: barPath(x, y(lo), y(v), barW), fill: 'url(#hatch)' }, svg);
                        el('line', { x1: x, x2: x + barW, y1: y(lo), y2: y(lo), stroke: 'var(--surface-2)', 'stroke-width': 2 }, svg);
                    }
                }
                const out = b.out[g];
                if (out > 0) el('path', { d: barPath(x, y(0), y(-out), barW), fill: `var(--${g})`, 'fill-opacity': 0.45 }, svg);
            });
            const diff = b.in.male - b.in.female;
            if (diff !== 0 && slot >= 30) {
                const label = el('text', { x: cx, y: y(Math.max(b.in.male, b.in.female)) - 5, 'text-anchor': 'middle' }, svg);
                label.textContent = `+${Math.abs(diff)} ${diff > 0 ? 'M' : 'K'}`;
                label.style.fill = 'var(--text-2)';
            }
            if (i % every === 0) el('text', { x: cx, y: H - 6, 'text-anchor': 'middle' }, svg).textContent = clock(b.start);

            const hit = el('rect', { x: m.l + slot * i, y: m.t, width: slot, height: ih, fill: 'transparent' }, svg);
            const enter = () => {
                mark.setAttribute('x', m.l + slot * i);
                mark.setAttribute('visibility', 'visible');
                showTip(tip, c, `<b>${clock(b.start)}–${clock(b.start + bucketSize)}</b><br>` +
                    `Mænd: ${b.in.male} kom, ${b.out.male} gik<br>Kvinder: ${b.in.female} kom, ${b.out.female} gik<br>` +
                    genderDiff(b.in.male, b.in.female, 'kom'),
                    16 + cx * (c.clientWidth - 32) / W, svg.getBoundingClientRect().top - c.getBoundingClientRect().top + y(Math.max(b.in.male, b.in.female)) * (svg.clientHeight / H));
            };
            hit.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') enter(); });
            hit.addEventListener('pointerdown', () => { hideAllTips(); enter(); });
            hit.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideBar(); });
        });
        el('line', { x1: m.l, x2: W - m.r, y1: y(0), y2: y(0), stroke: 'var(--muted)', 'pointer-events': 'none' }, svg);
    }

    function ratioChart(buckets) {
        const c = card('Ratio over tid', 'Mænd pr. kvinde, samlet set indtil hvert tidspunkt. Den stiplede linje er 1,0 (lige mange).');
        const tip = document.createElement('div');
        tip.className = 'tip';
        c.appendChild(tip);

        const pts = buckets.map((b, i) => ({ ...b, i })).filter(b => b.ratio !== null);
        if (pts.length === 0) {
            c.insertAdjacentHTML('beforeend', '<p class="empty">Ratioen vises, når der er talt mindst én kvinde.</p>');
            return;
        }

        const W = c.clientWidth - 32, H = 200;
        const m = { t: 10, r: 8, b: 24, l: 28 };
        const iw = W - m.l - m.r, ih = H - m.t - m.b;
        const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': 'Linjediagram over ratio mellem mænd og kvinder', 'data-touch-chart': '' }, c);

        const max = Math.max(2, Math.ceil(Math.max(...pts.map(p => p.ratio)) / 2) * 2);
        const y = v => m.t + ih - (v / max) * ih;
        const slot = iw / buckets.length;
        const x = i => m.l + slot * i + slot / 2;
        const ticks = 4;
        for (let k = 0; k <= ticks; k++) {
            const v = max * k / ticks;
            el('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: 'var(--grid)' }, svg);
            el('text', { x: m.l - 6, y: y(v) + 4, 'text-anchor': 'end' }, svg).textContent = v.toFixed(1).replace('.', ',');
        }
        el('line', { x1: m.l, x2: W - m.r, y1: y(1), y2: y(1), stroke: 'var(--text-2)', 'stroke-dasharray': '4 4' }, svg);
        const every = xLabelEvery(buckets.length, iw);
        buckets.forEach((b, i) => {
            if (i % every === 0) el('text', { x: x(i), y: H - 6, 'text-anchor': 'middle' }, svg).textContent = clock(b.start + bucketSize);
        });

        el('path', {
            d: pts.map((p, k) => `${k ? 'L' : 'M'}${x(p.i)},${y(p.ratio)}`).join(''),
            fill: 'none', stroke: 'var(--text)', 'stroke-width': 2, 'stroke-linejoin': 'round'
        }, svg);
        const last = pts[pts.length - 1];
        el('circle', { cx: x(last.i), cy: y(last.ratio), r: 4, fill: 'var(--text)', stroke: 'var(--surface-2)', 'stroke-width': 2 }, svg);

        const cross = el('line', { y1: m.t, y2: m.t + ih, stroke: 'var(--muted)', visibility: 'hidden' }, svg);
        const dot = el('circle', { r: 5, fill: 'var(--text)', stroke: 'var(--surface-2)', 'stroke-width': 2, visibility: 'hidden' }, svg);
        const area = el('rect', { x: m.l, y: m.t, width: iw, height: ih, fill: 'transparent' }, svg);
        const move = e => {
            const r = svg.getBoundingClientRect();
            const px = (e.clientX - r.left) * W / r.width;
            const p = pts.reduce((a, b) => Math.abs(x(b.i) - px) < Math.abs(x(a.i) - px) ? b : a);
            cross.setAttribute('x1', x(p.i)); cross.setAttribute('x2', x(p.i));
            dot.setAttribute('cx', x(p.i)); dot.setAttribute('cy', y(p.ratio));
            cross.setAttribute('visibility', 'visible'); dot.setAttribute('visibility', 'visible');
            showTip(tip, c, `<b>Kl. ${clock(p.start + bucketSize)}</b><br>Ratio: ${p.ratio.toFixed(2).replace('.', ',')}<br>${p.cumMale} mænd, ${p.cumFemale} kvinder`,
                16 + x(p.i) * r.width / W, r.top - c.getBoundingClientRect().top + y(p.ratio) * r.height / H);
        };
        const hideRatio = () => {
            tip.style.display = 'none';
            cross.setAttribute('visibility', 'hidden');
            dot.setAttribute('visibility', 'hidden');
        };
        hiders.push(hideRatio);
        area.addEventListener('pointermove', move);
        area.addEventListener('pointerdown', e => { hideAllTips(); move(e); });
        area.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideRatio(); });
    }

    function table(buckets) {
        const c = card('Tabel', '');
        c.querySelector('.sub').remove();
        const rows = buckets.map(b => `<tr><td>${clock(b.start)}</td><td>${b.in.male}</td><td>${b.out.male}</td><td>${b.in.female}</td><td>${b.out.female}</td><td>${b.ratio === null ? '–' : b.ratio.toFixed(2).replace('.', ',')}</td></tr>`).join('');
        c.insertAdjacentHTML('beforeend', `<details><summary>Vis tal</summary><table>
            <thead><tr><th>Fra</th><th>Mænd kom</th><th>Mænd gik</th><th>Kvinder kom</th><th>Kvinder gik</th><th>Ratio (samlet)</th></tr></thead>
            <tbody>${rows}</tbody></table></details>`);
        c.querySelector('h2').remove();
    }

    function renderSource() {
        const bar = document.getElementById('sourceBar');
        bar.innerHTML = '';
        if (!imported) return;
        bar.innerHTML = `<div class="source"><span>Viser filen <b></b> (${imported.rounds.flat().length} indtastninger). Tablettens egne data er urørte.</span>
            <button id="backToDevice">Vis tablettens data</button></div>`;
        bar.querySelector('b').textContent = imported.name;
        bar.querySelector('#backToDevice').addEventListener('click', () => {
            imported = null; selectedRound = null; zoom = null;
            renderSource(); render();
        });
    }

    function render() {
        const content = document.getElementById('content');
        content.innerHTML = '';
        const rounds = sourceRounds();
        renderRoundPicker(rounds);
        if (rounds.length === 0) {
            content.innerHTML = '<p class="empty">Ingen indtastninger endnu. Tæl på forsiden, så vises statistikken her.</p>';
            return;
        }
        const s = summarize(rounds[selectedRound]);
        const all = summarize(rounds.flat());
        const start = s.startMale + s.startFemale > 0 ? `<br>Heraf ved start: ${s.startMale} mænd, ${s.startFemale} kvinder` : '';
        content.insertAdjacentHTML('beforeend', `<p class="sub">Runde ${selectedRound + 1}: ${s.totalMale} mænd, ${s.totalFemale} kvinder, ${s.totalMale + s.totalFemale} personer i alt` + start +
            (rounds.length > 1 ? `<br>Alle runder: ${all.totalMale} mænd, ${all.totalFemale} kvinder, ${all.totalMale + all.totalFemale} personer i alt` : '') + '</p>');
        const buckets = buildBuckets(rounds[selectedRound], bucketSize);
        const charts = document.createElement('div');
        zoomControls(buckets, charts);
        content.appendChild(charts);
        renderCharts(buckets, charts);
    }

    // The buckets inside the zoomed period. Running totals and the ratio still count everyone
    // from the start of the round, so zooming never changes who was there.
    function zoomed(buckets) {
        if (!zoom) return buckets;
        const shown = buckets.filter(b => b.start + bucketSize > zoom[0] && b.start < zoom[1]);
        return shown.length ? shown : buckets;
    }

    function renderCharts(buckets, charts) {
        charts.innerHTML = '';
        hiders.length = 0;
        const shown = zoomed(buckets);
        cardTarget = charts;
        try {
            if (shown.length < buckets.length) {
                const sum = (g, dir) => shown.reduce((a, b) => a + b[dir][g], 0);
                const last = shown[shown.length - 1];
                charts.insertAdjacentHTML('beforeend', `<p class="sub">${clock(shown[0].start)}–${clock(last.start + bucketSize)}: ` +
                    `${sum('male', 'in')} mænd og ${sum('female', 'in')} kvinder kom, ${sum('male', 'out')} mænd og ${sum('female', 'out')} kvinder gik. ` +
                    `Til stede ved slut: ${last.cumMale} mænd, ${last.cumFemale} kvinder.</p>`);
            }
            barChart(shown);
            ratioChart(shown);
            table(shown);
        } finally {
            cardTarget = null;
        }
    }

    function zoomControls(buckets, charts) {
        if (buckets.length < 2) return;
        const c = card('Periode', 'Træk i skyderne for at zoome ind på en del af runden.');
        c.classList.add('zoom');
        const last = buckets.length - 1;
        const idx = t => Math.max(0, Math.min(last, Math.floor((t - buckets[0].start) / bucketSize)));
        const from = zoom ? idx(zoom[0]) : 0;
        const to = zoom ? idx(zoom[1] - 1) : last;
        c.insertAdjacentHTML('beforeend', `
            <label>Fra <input type="range" id="zoomFrom" min="0" max="${last}" step="1" value="${from}"><output id="zoomFromOut"></output></label>
            <label>Til <input type="range" id="zoomTo" min="0" max="${last}" step="1" value="${to}"><output id="zoomToOut"></output></label>
            <div class="row"><span class="sub" id="zoomLen" style="margin:0"></span><button id="zoomReset">Hele runden</button></div>`);
        const fromEl = c.querySelector('#zoomFrom'), toEl = c.querySelector('#zoomTo');
        const update = moved => {
            let f = Number(fromEl.value), t = Number(toEl.value);
            if (f > t) { if (moved === fromEl) toEl.value = t = f; else fromEl.value = f = t; }
            c.querySelector('#zoomFromOut').textContent = clock(buckets[f].start);
            c.querySelector('#zoomToOut').textContent = clock(buckets[t].start + bucketSize);
            const min = Math.round((t - f + 1) * bucketSize / 60);
            c.querySelector('#zoomLen').textContent = f === 0 && t === last ? 'Hele runden' : `${min} minutter valgt`;
            zoom = f === 0 && t === last ? null : [buckets[f].start, buckets[t].start + bucketSize];
        };
        update();
        fromEl.addEventListener('input', () => { update(fromEl); renderCharts(buckets, charts); });
        toEl.addEventListener('input', () => { update(toEl); renderCharts(buckets, charts); });
        c.querySelector('#zoomReset').addEventListener('click', () => {
            fromEl.value = 0; toEl.value = last; update(); renderCharts(buckets, charts);
        });
    }

    // CSV as written by "Hent CSV": runde,tidspunkt,køn,ændring[,type]. Also accepts ';'
    // (spreadsheet programs with Danish settings save that way).
    function parseCsv(text) {
        const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
        if (lines.length < 2) throw new Error('Filen er tom.');
        const sep = lines[0].includes(';') && !lines[0].includes(',') ? ';' : ',';
        const head = lines[0].toLowerCase().split(sep).map(h => h.trim());
        const col = name => {
            const i = head.indexOf(name);
            if (i < 0 && name !== 'type') throw new Error(`Kolonnen "${name}" mangler. Brug en fil fra Hent CSV.`);
            return i;
        };
        const [cR, cT, cG, cD, cK] = ['runde', 'tidspunkt', 'køn', 'ændring', 'type'].map(col);
        const byRound = new Map();
        lines.slice(1).forEach((line, n) => {
            const f = line.split(sep).map(x => x.trim());
            const t = Math.floor(Date.parse(f[cT]) / 1000);
            const g = { mand: 'male', male: 'male', kvinde: 'female', female: 'female' }[(f[cG] || '').toLowerCase()];
            const d = parseInt(f[cD], 10);
            if (isNaN(t) || !g || isNaN(d)) throw new Error(`Linje ${n + 2} kan ikke læses: ${line}`);
            const r = parseInt(f[cR], 10) || 1;
            if (!byRound.has(r)) byRound.set(r, []);
            byRound.get(r).push(cK >= 0 && f[cK] === 'start' ? [t, g, d, 'start'] : [t, g, d]);
        });
        return [...byRound.keys()].sort((a, b) => a - b)
            .map(k => byRound.get(k).sort((a, b) => a[0] - b[0]));
    }

    function renderRoundPicker(rounds) {
        if (selectedRound === null || selectedRound >= rounds.length) selectedRound = Math.max(0, rounds.length - 1);
        const seg = document.getElementById('roundSeg');
        seg.hidden = rounds.length < 2;
        seg.innerHTML = '';
        rounds.forEach((_, i) => {
            const btn = document.createElement('button');
            btn.textContent = 'Runde ' + (i + 1);
            btn.setAttribute('aria-pressed', i === selectedRound);
            btn.addEventListener('click', () => { selectedRound = i; zoom = null; render(); });
            seg.appendChild(btn);
        });
    }

    document.querySelectorAll('#sizeSeg button').forEach(btn => btn.addEventListener('click', () => {
        bucketSize = Number(btn.dataset.size);
        document.querySelectorAll('#sizeSeg button').forEach(b => b.setAttribute('aria-pressed', b === btn));
        render();
    }));

    document.getElementById('csv').addEventListener('click', () => {
        const lines = ['runde,tidspunkt,køn,ændring,type'].concat(sourceRounds().flatMap((r, i) => r.map(e =>
            `${i + 1},${new Date(e[0] * 1000).toISOString()},${e[1] === 'male' ? 'mand' : 'kvinde'},${e[2]},${isStart(e) ? 'start' : ''}`)));
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
        a.download = 'tangled-log.csv';
        a.click();
    });

    document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
    document.getElementById('importFile').addEventListener('change', async e => {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file) return;
        try {
            const rounds = parseCsv(await file.text());
            if (rounds.length === 0) throw new Error('Ingen indtastninger i filen.');
            imported = { name: file.name, rounds };
            selectedRound = null;
            zoom = null;
            renderSource();
            render();
        } catch (err) {
            document.getElementById('sourceBar').innerHTML = '<div class="source"><span class="error"></span></div>';
            document.querySelector('#sourceBar .error').textContent = 'Kunne ikke importere: ' + err.message;
        }
    });

    let resizeTimer;
    window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });
    render();
</script>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="6" stroke="#121212" stroke-width="2.5" stroke-opacity="0.7"/>
        </pattern>
    </defs>
</svg>
